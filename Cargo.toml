[package]
name = "agent-browser-cli"
version = "0.5.0"
edition = "2021"
description = "AI Agent browser CLI - high-performance headless browser control via CDP"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
chromiumoxide = { version = "0.5", features = ["tokio-runtime"] }
# M-02/M-05 fix: direct dependency for CDP event types (Network events, Target events)
chromiumoxide_cdp = "0.5"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
chrono = "0.4"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]}

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
